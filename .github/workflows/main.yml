name: Main

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7
    - name: Clippy
      run: rustup component add clippy && cargo clippy -p ozz-animation-rs -- --no-deps
    - name: Build
      run: >-
        cargo build --release --no-default-features &&
        cargo build --release --no-default-features --features serde &&
        cargo build --release
    - name: Run tests
      run: cargo test --release
      
  build-demo:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7
    - name: Build
      run: cd ./demo && cargo build
